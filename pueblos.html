<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¿Qué pueblo es?</title>
<style>
:root{--bg:#f6f7f9;--fg:#15181d;--mut:#5b6472;--acc:#0a7d3e;--card:#fff;--bd:#d9dde3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101215;--fg:#f1f3f5;--mut:#9aa3af;--acc:#4ade80;--card:#1a1d22;--bd:#2c3139;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101215;--fg:#f1f3f5;--mut:#9aa3af;--acc:#4ade80;--card:#1a1d22;--bd:#2c3139;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;background:#000;display:none}
main{position:relative;z-index:2;max-width:560px;margin:0 auto;padding:16px}
#mira{display:none;position:fixed;left:50%;top:50%;width:70px;height:70px;margin:-35px 0 0 -35px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.6),inset 0 0 0 1px rgba(0,0,0,.6);z-index:1;pointer-events:none}
#mira::after{content:"";position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;background:#ff3b30;border-radius:50%}
body.on #cam,body.on #mira{display:block}
body.on h1,body.on p{display:none}
body.on main{max-width:none;background:rgba(0,0,0,.62);color:#fff;border-radius:0 0 16px 16px;padding-top:calc(env(safe-area-inset-top,0px) + 12px)}
body.on #rumbo,body.on #msg,body.on .it span:last-child{color:#d6dae0}
body.on #mejor{font-size:34px;margin:6px 0}
body.on .it{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);color:#fff}
h1{font-size:20px;margin:0 0 4px}
p{color:var(--mut);margin:4px 0 14px;font-size:15px}
button{width:100%;padding:14px;font-size:17px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-weight:600}
#rumbo{font-size:26px;margin:16px 0 4px}
#mejor{font-size:40px;font-weight:700;color:var(--acc);margin:10px 0;min-height:48px;word-break:break-word}
.it{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:6px 0;display:flex;justify-content:space-between;gap:8px;font-size:15px}
.it span:last-child{color:var(--mut);white-space:nowrap}
#msg{color:var(--mut);font-size:14px;margin-top:10px}

/* Tema colorido */
html,body{background:linear-gradient(160deg,#6a11cb 0%,#2575fc 50%,#00c9a7 100%) fixed;color:#fff}
h1{font-size:28px}
p{color:#eef2ff}
button{background:linear-gradient(90deg,#ff512f,#f09819);box-shadow:0 8px 20px rgba(0,0,0,.3)}
#rumbo{display:inline-block;background:rgba(255,255,255,.22);padding:4px 14px;border-radius:999px;font-size:20px;font-weight:700;color:#fff!important}
#mejor{background:linear-gradient(90deg,#ffe259,#ff9a9e);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.it,body.on .it{background:rgba(255,255,255,.2);border:0;border-left:6px solid #ffe259;color:#fff;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.it:nth-child(2){border-left-color:#ff6ec4}
.it:nth-child(3){border-left-color:#7ee8fa}
.it span:last-child,body.on .it span:last-child{color:#fff!important;opacity:.85}
#msg,body.on #msg{color:#fff;opacity:.9}
body.on main{background:linear-gradient(135deg,rgba(106,17,203,.8),rgba(37,117,252,.72))}
#mira{border-color:#00f5d4;box-shadow:0 0 0 1px rgba(0,0,0,.5),0 0 18px #00f5d4}
#mira::after{background:#ff2d95;box-shadow:0 0 10px #ff2d95}
</style>
</head>
<body>
<video id="cam" playsinline muted autoplay></video>
<div id="mira"></div>
<main>
<h1>🧭 ¿Qué pueblo es?</h1>
<p>Pulsa el botón, sostén el móvil en vertical y apunta hacia el horizonte.</p>
<button id="go">Activar GPS y brújula</button>
<div id="rumbo"></div>
<div id="mejor"></div>
<div id="lista"></div>
<div id="msg"></div>
</main>
<script>
// [nombre, lat, lon] — localidades de España (aprox.)
var P=[["Madrid",40.417,-3.704],["Barcelona",41.387,2.170],["Valencia",39.470,-0.376],["Sevilla",37.389,-5.984],["Zaragoza",41.649,-0.887],["Málaga",36.721,-4.421],["Murcia",37.992,-1.131],["Palma",39.570,2.650],["Bilbao",43.263,-2.935],["Alicante",38.346,-0.483],["Córdoba",37.888,-4.779],["Valladolid",41.652,-4.724],["Vigo",42.240,-8.721],["Gijón",43.532,-5.661],["A Coruña",43.362,-8.411],["Granada",37.177,-3.599],["Vitoria",42.847,-2.673],["Elche",38.267,-0.698],["Oviedo",43.361,-5.849],["Cartagena",37.600,-0.986],["Jerez de la Frontera",36.686,-6.137],["Pamplona",42.812,-1.645],["Almería",36.834,-2.464],["San Sebastián",43.318,-1.981],["Burgos",42.344,-3.697],["Santander",43.462,-3.810],["Castellón",39.986,-0.037],["Albacete",38.995,-1.859],["Logroño",42.466,-2.445],["Badajoz",38.879,-6.970],["Salamanca",40.970,-5.664],["Huelva",37.261,-6.945],["Lleida",41.617,0.620],["Tarragona",41.119,1.245],["León",42.599,-5.567],["Cádiz",36.527,-6.289],["Jaén",37.779,-3.785],["Ourense",42.336,-7.864],["Girona",41.979,2.821],["Lugo",43.012,-7.556],["Cáceres",39.476,-6.372],["Toledo",39.863,-4.027],["Ciudad Real",38.986,-3.927],["Guadalajara",40.633,-3.167],["Cuenca",40.070,-2.137],["Segovia",40.943,-4.109],["Ávila",40.656,-4.700],["Soria",41.764,-2.469],["Teruel",40.345,-1.107],["Huesca",42.140,-0.408],["Palencia",42.010,-4.531],["Zamora",41.503,-5.744],["Pontevedra",42.431,-8.644],["Santiago de Compostela",42.878,-8.544],["Ronda",36.742,-5.167],["Marbella",36.510,-4.886],["Antequera",37.019,-4.561],["Úbeda",38.013,-3.370],["Baeza",37.994,-3.470],["Guadix",37.300,-3.140],["Motril",36.745,-3.518],["Lorca",37.671,-1.701],["Benidorm",38.538,-0.131],["Dénia",38.841,0.106],["Gandía",38.968,-0.181],["Sagunto",39.680,-0.278],["Xàtiva",38.990,-0.520],["Alcoy",38.705,-0.474],["Aranjuez",40.031,-3.603],["Alcalá de Henares",40.482,-3.364],["Talavera de la Reina",39.963,-4.831],["Mérida",38.916,-6.343],["Plasencia",40.030,-6.088],["Peñíscola",40.358,0.408],["Morella",40.620,-0.100],["Albarracín",40.408,-1.442],["Calatayud",41.353,-1.643],["Tortosa",40.812,0.521],["Reus",41.156,1.107],["Vic",41.930,2.255],["Figueres",42.267,2.961],["Manresa",41.730,1.826],["Andújar",38.039,-4.051],["Linares",38.095,-3.636],["Lucena",37.409,-4.485],["Écija",37.542,-5.082],["Carmona",37.471,-5.646],["Algeciras",36.133,-5.455],["Tarifa",36.014,-5.606],["Sanlúcar de Barrameda",36.778,-6.352],["Vélez-Málaga",36.775,-4.100],["Nerja",36.745,-3.875],["Baza",37.490,-2.771],["Loja",37.168,-4.150],["Órgiva",36.900,-3.425],["Mojácar",37.139,-1.851]];
var TOL=8,pos=null,hd=0,sm=null;
var $=function(i){return document.getElementById(i)};
var R=Math.PI/180;
function brg(a,b,c,d){var L=(d-b)*R,y=Math.sin(L)*Math.cos(c*R),x=Math.cos(a*R)*Math.sin(c*R)-Math.sin(a*R)*Math.cos(c*R)*Math.cos(L);return (Math.atan2(y,x)/R+360)%360}
function dst(a,b,c,d){var p=(c-a)*R,q=(d-b)*R,h=Math.sin(p/2)*Math.sin(p/2)+Math.cos(a*R)*Math.cos(c*R)*Math.sin(q/2)*Math.sin(q/2);return 12742*Math.atan2(Math.sqrt(h),Math.sqrt(1-h))}
function dif(a,b){return Math.abs(((a-b+540)%360)-180)}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}

function pintar(){
  if(!pos){return}
  $("rumbo").textContent="Rumbo: "+Math.round(hd)+"°";
  var r=P.map(function(p){return{n:p[0],d:dif(brg(pos.latitude,pos.longitude,p[1],p[2]),hd),k:dst(pos.latitude,pos.longitude,p[1],p[2])}})
    .filter(function(p){return p.d<=TOL&&p.k>0.5}).sort(function(a,b){return a.d-b.d}).slice(0,3);
  $("mejor").textContent=r[0]?r[0].n:"—";
  $("lista").innerHTML=r.map(function(p){return '<div class="it"><span>'+esc(p.n)+'</span><span>'+p.k.toFixed(0)+' km · ±'+p.d.toFixed(1)+'°</span></div>'}).join("");
  if(!r.length)$("msg").textContent="Nada en esa dirección. Prueba a girar un poco.";else $("msg").textContent="";
}
function setH(n){
  if(sm===null)sm=n;
  var d=((n-sm+540)%360)-180; sm=(sm+0.2*d+360)%360; hd=sm; pintar();
}
function onOri(e){
  if(typeof e.webkitCompassHeading==="number"){setH(e.webkitCompassHeading);return}
  if(e.alpha===null||e.beta===null||e.gamma===null)return;
  var a=e.alpha*R,b=e.beta*R,g=e.gamma*R;
  var rA=-Math.cos(a)*Math.sin(g)-Math.sin(a)*Math.sin(b)*Math.cos(g);
  var rB=-Math.sin(a)*Math.sin(g)+Math.cos(a)*Math.sin(b)*Math.cos(g);
  setH((Math.atan2(rA,rB)/R+360)%360);
}
async function masPueblos(){
  // Intenta ampliar con OpenStreetMap; si la red lo bloquea, se usa la lista incluida.
  try{
    var q='[out:json][timeout:20];node["place"~"town|village"]["name"](around:40000,'+pos.latitude+','+pos.longitude+');out;';
    var r=await fetch("https://overpass-api.de/api/interpreter",{method:"POST",body:"data="+encodeURIComponent(q)});
    var j=await r.json();
    j.elements.forEach(function(e){P.push([e.tags.name,e.lat,e.lon])});
  }catch(e){}
}
async function camara(){
  // Cámara trasera de fondo, para ver hacia dónde apunta la mira. Si se deniega, la mira sigue funcionando.
  try{
    var st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});
    var v=$("cam");v.srcObject=st;v.play();
  }catch(e){}
}
$("go").onclick=async function(){
  $("msg").textContent="Pidiendo permisos…";
  try{
    if(typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function"){
      var s=await DeviceOrientationEvent.requestPermission();
      if(s!=="granted"){$("msg").textContent="El iPhone ha denegado el acceso a la brújula (estado: "+s+"). Abre esta página en Safari, no dentro de otra app.";return}
    }
  }catch(e){$("msg").textContent="Error de brújula: "+(e&&e.message?e.message:e)+". Abre esta página directamente en Safari.";return}
  if(!navigator.geolocation){$("msg").textContent="Este navegador no tiene GPS.";return}
  navigator.geolocation.getCurrentPosition(function(p){
    pos=p.coords;$("go").style.display="none";$("msg").textContent="Ubicación obtenida.";
    masPueblos();document.body.classList.add("on");camara();
    window.addEventListener("deviceorientationabsolute",onOri,true);
    window.addEventListener("deviceorientation",onOri,true);
  },function(e){$("msg").textContent="No pude obtener la ubicación ("+e.message+"). Revisa el permiso de ubicación del navegador."},{enableHighAccuracy:true,timeout:15000});
};
</script>
</body>
</html>
